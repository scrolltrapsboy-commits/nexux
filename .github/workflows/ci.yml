name: NEXUS PLAY CI
on:
  push:
    branches: [main, nexus-v3-rebuild, nexus-v3-release]
  pull_request:
    branches: [main]
concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check server/gameEngine.js
      - run: node --check public/app.js
      - run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/nexus-npm-test.log
      - run: |
          node server.js > /tmp/nexus.log 2>&1 &
          echo $! > /tmp/nexus.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/nexus-health.json; then
              cat /tmp/nexus-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexus.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e.smoke.spec.js --workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-logs
          path: /tmp/nexus-*.log
          if-no-files-found: ignore
      - if: always()
        run: |
          if [ -f /tmp/nexus.log ]; then cat /tmp/nexus.log; fi
          if [ -f /tmp/nexus.pid ]; then kill $(cat /tmp/nexus.pid) 2>/dev/null || true; fi
